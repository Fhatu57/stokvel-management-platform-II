<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payout Schedule - Stokvel Management</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <section class="app-layout" data-testid="payouts-page">

    <aside class="sidebar" data-testid="sidebar">
      <header class="sidebar-logo">
        <figure class="logo-circles" style="width:36px;height:36px;">
          <i class="logo-circle logo-circle-green" style="width:24px;height:24px;"></i>
          <i class="logo-circle logo-circle-blue"  style="width:24px;height:24px;"></i>
        </figure>
        <h2>Stokvel</h2>
      </header>
      <nav class="sidebar-nav">
        <section class="nav-section">
          <p class="nav-section-title">Main Menu</p>
        </section>
      </nav>
      <footer class="sidebar-user" data-testid="user-info">
        <abbr class="user-avatar" title="User initials">?</abbr>
        <section class="user-info">
          <strong class="user-name">Loading…</strong>
          <em class="user-role">Member</em>
        </section>
        <button class="btn btn-ghost btn-sm" onclick="logout()" data-testid="logout-btn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </footer>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>Payout Schedule</h1>
        <p>View who gets paid when. Treasurers can set and update the order.</p>
      </header>

      <!-- Group selector -->
      <div style="margin-bottom:1.5rem;max-width:320px;">
        <label class="form-label" for="payout-group-select">Select group</label>
        <select id="payout-group-select" class="form-input">
          <option>Loading…</option>
        </select>
      </div>

      <!-- Schedule table -->
      <article class="card" style="margin-bottom:1.5rem;">
        <header class="card-header">
          <h3 class="card-title">Payout Order</h3>
        </header>
        <div id="payout-schedule-list" style="padding:.5rem 0;">
          <p style="color:var(--slate-400);">Loading…</p>
        </div>
      </article>

      <!-- Drag-to-reorder editor — Treasurer/Admin only -->
      <article class="card" id="payout-editor-section" style="display:none;">
        <header class="card-header">
          <h3 class="card-title">Set Payout Order</h3>
          <p style="font-size:.85rem;color:var(--slate-500);margin:0;">Drag members to reorder. Member at position 1 gets paid first.</p>
        </header>
        <ul id="payout-order-list" style="padding:.5rem 0;list-style:none;max-width:400px;user-select:none;">
          <li style="color:var(--slate-400);padding:.5rem;">Loading members…</li>
        </ul>
        <div style="padding:.5rem 0 1rem;">
          <button id="save-payout-order-btn" class="btn btn-primary">Save Payout Order</button>
        </div>
      </article>
    </main>
  </section>

  <output id="toast-container" class="toast-container"></output>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
