<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Stokvel Management</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <section class="app-layout" data-testid="notifications-page">

    <aside class="sidebar" data-testid="sidebar">
      <header class="sidebar-logo">
        <figure class="logo-circles" style="width: 36px; height: 36px;">
          <i class="logo-circle logo-circle-green" style="width: 24px; height: 24px;"></i>
          <i class="logo-circle logo-circle-blue" style="width: 24px; height: 24px;"></i>
        </figure>
        <h2>Stokvel</h2>
      </header>

      <nav class="sidebar-nav">
        <section class="nav-section">
          <p class="nav-section-title">Main Menu</p>
          <a href="member-dashboard.html" class="nav-link" data-testid="nav-dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect>
              <rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>
            </svg>
            Dashboard
          </a>
          <a href="contributions.html" class="nav-link" data-testid="nav-contributions">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            My Contributions
          </a>
          <a href="meetings.html" class="nav-link" data-testid="nav-meetings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Meetings
          </a>
          <a href="payouts.html" class="nav-link" data-testid="nav-payouts">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            Payout Schedule
          </a>
          <a href="notifications.html" class="nav-link active" data-testid="nav-notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            Notifications
          </a>
          <a href="profile.html" class="nav-link" data-testid="nav-profile">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            My Profile
          </a>
        </section>
      </nav>

      <footer class="sidebar-user" data-testid="user-info">
        <abbr class="user-avatar" title="User initials" id="sidebar-avatar">?</abbr>
        <section class="user-info">
          <strong class="user-name" id="sidebar-name">Loading...</strong>
          <em class="user-role" id="sidebar-role">member</em>
        </section>
        <button class="btn btn-ghost btn-sm" onclick="logout()" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </footer>
    </aside>

    <main class="main-content">
      <header class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1 class="page-title">Notifications</h1>
          <p class="page-subtitle">Recent activity in your groups</p>
        </div>
        
      </header>

      <!-- Filter tabs -->
      <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" onclick="window.filterNotifs('all')" id="filter-all">All</button>
        <button class="btn btn-outline btn-sm" onclick="window.filterNotifs('payment')" id="filter-payment">Payments</button>
        <button class="btn btn-outline btn-sm" onclick="window.filterNotifs('meeting')" id="filter-meeting">Meetings</button>
        <button class="btn btn-outline btn-sm" onclick="window.filterNotifs('payout')" id="filter-payout">Payouts</button>
        <button class="btn btn-outline btn-sm" onclick="window.filterNotifs('group')" id="filter-group">Groups</button>
      </div>

      <!-- Notifications list -->
      <div id="notifications-list">
        <p style="color:var(--slate-400);text-align:center;padding:2rem;">Loading notifications...</p>
      </div>
    </main>
  </section>
  <script type="module" src="js/main.js"></script>
</body>
</html>
