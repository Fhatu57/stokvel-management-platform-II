<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings - Stokvel Management</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <section class="app-layout" data-testid="meetings-page">

    <aside class="sidebar" data-testid="sidebar">
      <header class="sidebar-logo">
        <figure class="logo-circles" style="width:36px;height:36px;">
          <i class="logo-circle logo-circle-green" style="width:24px;height:24px;"></i>
          <i class="logo-circle logo-circle-blue"  style="width:24px;height:24px;"></i>
        </figure>
        <h2>Stokvel</h2>
      </header>
      <nav class="sidebar-nav">
        <section class="nav-section">
          <p class="nav-section-title">Main Menu</p>
          <!-- rebuilt by checkAuth() -->
        </section>
      </nav>
      <footer class="sidebar-user" data-testid="user-info">
        <abbr class="user-avatar" title="User initials">?</abbr>
        <section class="user-info">
          <strong class="user-name">Loading…</strong>
          <em class="user-role">Member</em>
        </section>
        <button class="btn btn-ghost btn-sm" onclick="logout()" data-testid="logout-btn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </footer>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>Meetings</h1>
        <p>View upcoming meetings, agendas, and past minutes.</p>
      </header>

      <!-- Schedule form — shown only to Treasurer/Admin via JS -->
      <article class="card" id="schedule-meeting-section" style="display:none;margin-bottom:1.5rem;">
        <header class="card-header">
          <h3 class="card-title">Schedule a Meeting</h3>
        </header>
        <form id="schedule-meeting-form" style="display:grid;gap:1rem;max-width:540px;">
          <div>
            <label class="form-label" for="meeting-group-id">Group</label>
            <select id="meeting-group-id" class="form-input" required>
              <option value="">Loading groups…</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="meeting-title">Meeting title</label>
            <input type="text" id="meeting-title" class="form-input" placeholder="e.g. Monthly Review" required>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div>
              <label class="form-label" for="meeting-date">Date</label>
              <input type="date" id="meeting-date" class="form-input" required>
            </div>
            <div>
              <label class="form-label" for="meeting-time">Time</label>
              <input type="time" id="meeting-time" class="form-input" value="09:00">
            </div>
          </div>
          <div>
            <label class="form-label" for="meeting-location">Location (optional)</label>
            <input type="text" id="meeting-location" class="form-input" placeholder="e.g. Community Hall, Zoom link…">
          </div>
          <div>
            <label class="form-label" for="meeting-agenda">Agenda (optional)</label>
            <textarea id="meeting-agenda" class="form-input" rows="4" placeholder="1. Welcome&#10;2. Review contributions&#10;3. Payout update…" style="resize:vertical;"></textarea>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">Schedule Meeting</button>
          </div>
        </form>
      </article>

      <!-- Meetings list -->
      <article class="card">
        <header class="card-header">
          <h3 class="card-title">All Meetings</h3>
        </header>
        <div id="meetings-list" style="padding:.5rem 0;">
          <p style="color:var(--slate-400);">Loading…</p>
        </div>
      </article>
    </main>
  </section>

  <output id="toast-container" class="toast-container"></output>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
