name: Deploy portfolio to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated checks
        run: npm test

      - name: Keep production dependencies only
        run: npm prune --omit=dev --workspaces

      - name: Create deployment package
        run: |
          mkdir deployment
          cp package.json package-lock.json deployment/
          cp -R backend frontend node_modules deployment/
          rm -rf deployment/backend/coverage deployment/frontend/coverage
          rm -rf deployment/backend/__tests__ deployment/frontend/js/__tests__

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: stokvel-portfolio-app
          path: deployment
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: stokvel-portfolio-app
          path: deployment

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deployment
